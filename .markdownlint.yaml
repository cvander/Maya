# markdownlint rules. See https://github.com/DavidAnson/markdownlint
# Prose-heavy docs — keep the ruleset minimal to avoid fighting content.
default: true

# MD013 — Line length. Prose can run long; disable.
MD013: false

# MD033 — Inline HTML. Allowed for badge markup and the occasional <details>.
MD033: false

# MD041 — First line in file must be a top-level heading. CHANGELOG and
# some templates violate this intentionally; disable.
MD041: false

# MD034 — No bare URLs. Prose and data files (CoC, research notes,
# artist contact lists) legitimately include bare URLs and emails.
# Disable rather than mechanically wrap every occurrence in <...>.
MD034: false
